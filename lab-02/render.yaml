services:
  - type: web
    name: backend-fundamentals-lab-02
    runtime: node
    rootDir: lab-02
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/books.db
    disk:
      name: lab-02-sqlite-data
      mountPath: /var/data
      sizeGB: 1
